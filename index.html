<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bossworks Video Demo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Bossworks Demo</h1>
    </header>

    <main id="video-container">
        <section class="comparison-group">
            <h2>Bossworks Videos</h2>
            <div class="video-row">
                <div class="video-wrapper">
                    <h3>Ad</h3>
                    <video id="ad-video" controls playsinline src="assets/bossworks/ad.mp4"></video>
                </div>
                <div class="video-wrapper">
                    <h3>Talk</h3>
                    <video controls playsinline src="assets/bossworks/talk.mp4"></video>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
